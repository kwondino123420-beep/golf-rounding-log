<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>라운딩 로그 · 골프 스코어 트래커</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#1f6f43">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="라운딩로그">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<link rel="icon" href="./icons/icon-192.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<style>
  :root{
    --green:#1c5c40;
    --green-dark:#0f3325;
    --green-light:#e9f1e9;
    --gold:#a97a35;
    --gold-light:#f6ecd9;
    --bg:#f6f4ee;
    --card:#fffefb;
    --ink:#20241d;
    --text:#20241d;
    --muted:#767a6c;
    --border:#e6e2d3;
    --red:#b6483c;
    --red-light:#f8e9e6;
    --blue:#33578f;
    --blue-light:#e7ecf5;
    --amber:#a97a35;
    --radius:18px;
    --radius-sm:11px;
    --shadow:0 1px 2px rgba(28,32,20,0.04), 0 6px 20px -6px rgba(28,32,20,0.10);
    --shadow-lift:0 2px 4px rgba(28,32,20,0.05), 0 12px 28px -8px rgba(28,32,20,0.16);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);
    color:var(--text);
    -webkit-tap-highlight-color:transparent;
    -webkit-font-smoothing:antialiased;
    letter-spacing:-0.01em;
  }
  #app{max-width:720px;margin:0 auto;padding:0 0 60px;min-height:100vh;background:var(--bg);}
  a{color:inherit;}
  h1,h2,h3{text-wrap:balance;}
  .icon{display:inline-flex;align-items:center;justify-content:center;vertical-align:-3px;flex:none;}
  .icon svg{display:block;}
  ::selection{background:var(--green);color:#fff;}

  /* top bar */
  .topbar{
    position:sticky;top:0;z-index:20;
    background:linear-gradient(165deg,var(--green),var(--green-dark));color:#fff;
    padding:14px 16px;display:flex;align-items:center;justify-content:space-between;
    box-shadow:var(--shadow);
  }
  .topbar .brand{font-weight:800;font-size:16.5px;letter-spacing:-.01em;display:flex;align-items:center;gap:9px;}
  .topbar .brand .badge{
    width:26px;height:26px;border-radius:8px;background:rgba(255,255,255,0.16);
    display:flex;align-items:center;justify-content:center;color:#fff;
  }
  .topbar button{
    background:rgba(255,255,255,0.14);color:#fff;border:none;border-radius:9px;
    padding:7px 12px;font-size:12.5px;font-weight:700;cursor:pointer;
    display:inline-flex;align-items:center;gap:5px;
  }
  .topbar button:active{background:rgba(255,255,255,0.28);}

  .tabs{
    display:flex;gap:2px;padding:6px 10px 0;background:var(--card);border-bottom:1px solid var(--border);
    position:sticky;top:53px;z-index:19;overflow-x:auto;
  }
  .tab{
    flex:1;text-align:center;padding:10px 6px 9px;font-size:12.5px;font-weight:700;
    color:var(--muted);cursor:pointer;white-space:nowrap;border-bottom:2.5px solid transparent;
    display:flex;flex-direction:column;align-items:center;gap:4px;transition:color .15s ease;
  }
  .tab .icon{opacity:.75;}
  .tab.active{color:var(--green);border-bottom-color:var(--green);}
  .tab.active .icon{opacity:1;}

  .view{padding:16px;}
  .card{
    background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);
    padding:18px;margin-bottom:14px;border:1px solid var(--border);
  }
  .card h2{margin:0 0 5px;font-size:17px;font-weight:800;letter-spacing:-.01em;}
  .card h3{margin:0 0 12px;font-size:11.5px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.06em;}
  .muted{color:var(--muted);font-size:13px;}
  .row{display:flex;gap:10px;align-items:center;}
  .row.between{justify-content:space-between;}
  .row.wrap{flex-wrap:wrap;}
  .grow{flex:1;}

  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:6px;
    background:linear-gradient(180deg,var(--green) 0%,var(--green-dark) 130%);color:#fff;border:none;border-radius:12px;
    padding:12px 16px;font-size:14px;font-weight:700;cursor:pointer;letter-spacing:-.01em;
    box-shadow:0 1px 1px rgba(15,51,37,0.15), 0 4px 10px -4px rgba(15,51,37,0.4);
    transition:transform .12s ease, box-shadow .12s ease, opacity .12s ease;
  }
  .btn:active{transform:translateY(1px) scale(.99);box-shadow:0 1px 1px rgba(15,51,37,0.2);}
  .btn.secondary{background:var(--card);color:var(--green-dark);border:1.5px solid var(--green);box-shadow:none;}
  .btn.secondary:active{background:var(--green-light);}
  .btn.ghost{background:transparent;color:var(--muted);border:1px solid var(--border);box-shadow:none;}
  .btn.ghost:active{background:var(--border);}
  .btn.danger{background:var(--card);color:var(--red);border:1.5px solid var(--red);box-shadow:none;}
  .btn.block{width:100%;}
  .btn.sm{padding:8px 11px;font-size:12.5px;border-radius:9px;}
  .btn:disabled{opacity:.4;cursor:not-allowed;transform:none;}

  input[type=text],input[type=number],select{
    width:100%;padding:11px 12px;border:1.5px solid var(--border);border-radius:var(--radius-sm);
    font-size:14px;background:var(--card);color:var(--text);font-family:inherit;
  }
  input:focus,select:focus{outline:none;border-color:var(--green);box-shadow:0 0 0 3px var(--green-light);}
  label{font-size:12px;color:var(--muted);font-weight:700;display:block;margin-bottom:5px;letter-spacing:.01em;}
  .field{margin-bottom:12px;}

  .empty{
    text-align:center;padding:38px 16px;color:var(--muted);
  }
  .empty .big{margin-bottom:12px;color:var(--border);display:flex;justify-content:center;}

  .list-item{
    display:flex;align-items:center;justify-content:space-between;
    padding:13px 4px;border-bottom:1px solid var(--border);
  }
  .list-item:last-child{border-bottom:none;}
  .list-item .name{font-weight:700;font-size:14.5px;}
  .list-item .meta{font-size:12px;color:var(--muted);margin-top:3px;display:flex;align-items:center;gap:4px;flex-wrap:wrap;}

  .pill{
    display:inline-flex;align-items:center;gap:3px;padding:3px 10px;border-radius:999px;font-size:11.5px;font-weight:700;
    background:var(--green-light);color:var(--green-dark);font-variant-numeric:tabular-nums;
  }
  .pill.over{background:var(--red-light);color:var(--red);}
  .pill.under{background:var(--blue-light);color:var(--blue);}
  .pill.gold{background:var(--gold-light);color:var(--gold);}

  /* course editor */
  .hole-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:7px;margin-bottom:10px;}
  .hole-cell{text-align:center;}
  .hole-cell .hn{font-size:10.5px;color:var(--muted);margin-bottom:4px;font-weight:600;}
  .hole-cell select{padding:7px 2px;font-size:13px;text-align:center;font-weight:700;}
  .par-sum{font-size:12.5px;color:var(--green);font-weight:800;}

  /* round view */
  .hole-hero{
    position:relative;overflow:hidden;
    background:linear-gradient(160deg,var(--green) 0%,var(--green-dark) 100%);
    color:#fff;border-radius:22px;padding:24px 22px;text-align:center;margin-bottom:14px;
    box-shadow:var(--shadow-lift);
  }
  .hole-hero::before{
    content:"";position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(120% 90% at 50% -20%, rgba(255,255,255,0.14), transparent 60%);
  }
  .hole-hero>*{position:relative;}
  .hole-hero .label{font-size:11.5px;opacity:.8;letter-spacing:.08em;text-transform:uppercase;font-weight:700;}
  .hole-hero .num{font-size:50px;font-weight:800;line-height:1.05;letter-spacing:-.02em;font-variant-numeric:tabular-nums;margin-top:2px;}
  .hole-hero .par{font-size:13.5px;opacity:.85;margin-top:4px;font-weight:600;letter-spacing:.04em;}
  .hole-hero .par::before{content:"";display:inline-block;width:4px;height:4px;border-radius:50%;background:var(--gold);margin-right:7px;vertical-align:1px;}
  .distance-line{margin-top:16px;}
  .distance-line .dist-num{font-size:34px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums;}
  .distance-line .dist-unit{font-size:13px;opacity:.75;margin-left:4px;font-weight:600;}
  .distance-line .dist-sub{font-size:12px;opacity:.7;margin-top:1px;}
  .hole-nav{display:flex;gap:8px;margin-top:16px;}
  .hole-nav .btn{flex:1;background:rgba(255,255,255,0.14);box-shadow:none;font-weight:600;}
  .hole-nav .btn:active{background:rgba(255,255,255,0.26);}

  .hole-strip{display:flex;gap:6px;overflow-x:auto;padding:4px 2px 10px;}
  .hole-chip{
    min-width:38px;height:42px;border-radius:11px;display:flex;flex-direction:column;
    align-items:center;justify-content:center;font-size:11px;font-weight:700;
    background:var(--card);border:1.5px solid var(--border);color:var(--muted);flex-shrink:0;cursor:pointer;
    transition:transform .1s ease;font-variant-numeric:tabular-nums;
  }
  .hole-chip:active{transform:scale(.94);}
  .hole-chip .n{font-size:9px;font-weight:600;opacity:.65;margin-top:1px;}
  .hole-chip.current{border-color:var(--green);color:var(--green);background:var(--green-light);box-shadow:0 0 0 3px var(--green-light);}
  .hole-chip.filled{background:var(--green-dark);color:#fff;border-color:var(--green-dark);}
  .hole-chip.filled .n{opacity:.6;}

  .player-card{border:1.5px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:10px;background:var(--card);}
  .player-card .pname{font-weight:800;font-size:15px;letter-spacing:-.01em;}
  .player-card .stat-row{display:flex;gap:14px;margin:9px 0;font-size:12.5px;color:var(--muted);flex-wrap:wrap;}
  .player-card .stat-row b{color:var(--text);font-variant-numeric:tabular-nums;}
  .guidance{
    display:flex;gap:8px;align-items:flex-start;
    font-size:12.5px;background:var(--green-light);color:var(--green-dark);
    border-radius:var(--radius-sm);padding:9px 11px;margin-bottom:10px;font-weight:600;line-height:1.5;
  }
  .guidance .icon{margin-top:1px;opacity:.85;}
  .guidance.warn{background:var(--red-light);color:var(--red);}
  .score-pills{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px;}
  .score-pill{
    padding:9px 0;width:45px;text-align:center;border-radius:10px;border:1.5px solid var(--border);
    font-size:13.5px;font-weight:800;background:var(--card);cursor:pointer;color:var(--text);
    transition:transform .1s ease;font-variant-numeric:tabular-nums;
  }
  .score-pill:active{transform:scale(.93);}
  .score-pill.selected{background:var(--green);color:#fff;border-color:var(--green);box-shadow:0 3px 8px -2px rgba(15,51,37,0.5);}
  .manual-input{display:flex;gap:8px;align-items:center;}
  .manual-input input{width:84px;flex:none;}

  table.scorecard{width:100%;border-collapse:collapse;font-size:12px;white-space:nowrap;font-variant-numeric:tabular-nums;}
  table.scorecard th,table.scorecard td{padding:6px;text-align:center;border-bottom:1px solid var(--border);}
  table.scorecard th{color:var(--muted);font-weight:700;font-size:10px;}
  table.scorecard td.pname{text-align:left;font-weight:700;position:sticky;left:0;background:var(--card);box-shadow:2px 0 4px -2px rgba(28,32,20,0.08);}
  .scroll-x{overflow-x:auto;}
  .score-mark{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;font-weight:800;}
  .score-birdie{color:var(--blue);border-radius:50%;box-shadow:0 0 0 1.5px var(--blue);}
  .score-bogey{color:var(--red);border-radius:3px;box-shadow:0 0 0 1.5px var(--red);}
  .score-par{color:var(--text);font-weight:700;}

  .share-box{display:flex;gap:8px;margin-top:8px;}
  .share-box input{flex:1;font-size:12px;color:var(--muted);}

  .toast{
    position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(4px);
    background:var(--ink);color:#fff;padding:11px 20px;border-radius:999px;
    font-size:13px;font-weight:600;box-shadow:var(--shadow-lift);z-index:100;opacity:0;pointer-events:none;
    transition:opacity .22s ease, transform .22s ease;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  .modal-backdrop{
    position:fixed;inset:0;background:rgba(20,24,16,0.5);z-index:50;
    display:flex;align-items:flex-end;justify-content:center;
    animation:fadeIn .18s ease;
  }
  @keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
  @keyframes slideUp{from{transform:translateY(24px);opacity:.4;}to{transform:translateY(0);opacity:1;}}
  .modal{
    background:var(--card);border-radius:22px 22px 0 0;padding:20px 18px 26px;width:100%;max-width:720px;
    max-height:88vh;overflow-y:auto;animation:slideUp .22s cubic-bezier(.2,.7,.3,1);
  }
  @media(min-width:600px){
    .modal-backdrop{align-items:center;}
    .modal{border-radius:20px;max-width:480px;}
  }
  .modal h3{margin:0 0 12px;font-size:17px;font-weight:800;}
  .close-x{float:right;background:none;border:none;font-size:20px;color:var(--muted);cursor:pointer;line-height:1;}

  .leader-table{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums;}
  .leader-table th,.leader-table td{padding:9px 6px;text-align:left;border-bottom:1px solid var(--border);}
  .leader-table th{color:var(--muted);font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;}

  .gps-row{display:flex;gap:8px;margin-top:14px;}
  .gps-row .btn{flex:1;background:rgba(255,255,255,0.14);box-shadow:none;font-weight:600;}
  .gps-row .btn:active{background:rgba(255,255,255,0.26);}
  .gps-hint{margin-top:8px;font-size:12px;opacity:.8;display:flex;align-items:center;justify-content:center;gap:5px;cursor:pointer;}
  #mapContainer{height:320px;border-radius:var(--radius-sm);overflow:hidden;background:var(--border);}
  .ad-slot{
    background:var(--card);border:1.5px dashed var(--border);border-radius:var(--radius-sm);
    padding:16px;text-align:center;color:var(--muted);font-size:11.5px;
  }
  .app-footer{
    text-align:center;padding:20px 16px 10px;font-size:11.5px;color:var(--muted);
  }
  .app-footer a{color:var(--green);text-decoration:none;font-weight:700;}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>

<script>
(function(){
"use strict";

/* ---------- storage ---------- */
const LS_COURSES = "grl_courses";
const LS_ROUNDS  = "grl_rounds";
const LS_CONSENT = "grl_locationConsent";
const LS_INSTALL_DISMISSED = "grl_installBannerDismissed";

function uid(){ return (crypto.randomUUID ? crypto.randomUUID() : ("id-"+Date.now()+"-"+Math.random().toString(16).slice(2))); }

/* ---------- icon system (inline SVG, currentColor) ---------- */
const ICON_PATHS = {
  home: '<path d="M4 11.5 12 4l8 7.5"/><path d="M6 10v9a1 1 0 0 0 1 1h3v-6h4v6h3a1 1 0 0 0 1-1v-9"/>',
  pin: '<path d="M12 21s-7-7.4-7-12.4a7 7 0 0 1 14 0C19 13.6 12 21 12 21z"/><circle cx="12" cy="8.6" r="2.6"/>',
  flag: '<path d="M6 21V4"/><path d="M6 4h11l-3 4 3 4H6"/>',
  plus: '<path d="M12 5v14M5 12h14"/>',
  list: '<path d="M8 6h13M8 12h13M8 18h13"/><circle cx="3.5" cy="6" r="1.3" fill="currentColor" stroke="none"/><circle cx="3.5" cy="12" r="1.3" fill="currentColor" stroke="none"/><circle cx="3.5" cy="18" r="1.3" fill="currentColor" stroke="none"/>',
  map: '<path d="m9 4-6 2v15l6-2 6 2 6-2V4l-6 2-6-2Z"/><path d="M9 4v15M15 6v15"/>',
  phone: '<rect x="7" y="2" width="10" height="20" rx="2.2"/><path d="M11 18h2"/>',
  trophy: '<path d="M8 4h8v5a4 4 0 0 1-8 0V4z"/><path d="M8 5H4v2a4 4 0 0 0 4 4M16 5h4v2a4 4 0 0 1-4 4"/><path d="M12 13v4M9 21h6M9.5 17h5l.5 4H9l.5-4z"/>',
  target: '<circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4.5"/><circle cx="12" cy="12" r=".8" fill="currentColor" stroke="none"/>',
  link: '<path d="M9 15 15 9"/><path d="M10 6.5 11.2 5.3a3.8 3.8 0 0 1 5.5 5.5L15.5 12"/><path d="M14 17.5 12.8 18.7a3.8 3.8 0 0 1-5.5-5.5L8.5 12"/>',
  gauge: '<path d="M4 15a8 8 0 0 1 16 0"/><path d="M12 15 15.5 10"/><circle cx="12" cy="15" r="1" fill="currentColor" stroke="none"/>',
  bulb: '<path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-3.5 10.9c.6.45 1 1.2 1 2.1h5c0-.9.4-1.65 1-2.1A6 6 0 0 0 12 3z"/>',
  flagHole: '<ellipse cx="12" cy="20.5" rx="7" ry="1.6"/><path d="M8 20.5V6"/><path d="M8 6l8 3-8 3"/>',
  refresh: '<path d="M20 11A8 8 0 0 0 6 6.3L4 8"/><path d="M4 4v4h4"/><path d="M4 13a8 8 0 0 0 14 4.7l2-2"/><path d="M20 20v-4h-4"/>'
};
function icon(name, size){
  size = size || 16;
  return `<span class="icon" style="width:${size}px;height:${size}px;"><svg viewBox="0 0 24 24" width="${size}" height="${size}" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ICON_PATHS[name]||""}</svg></span>`;
}
function loadJSON(key, fallback){
  try{ const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; }
  catch(e){ return fallback; }
}
function saveJSON(key, val){ localStorage.setItem(key, JSON.stringify(val)); }

let courses = loadJSON(LS_COURSES, []);
let rounds  = loadJSON(LS_ROUNDS, []);

function persistCourses(){ saveJSON(LS_COURSES, courses); }
function persistRounds(){ saveJSON(LS_ROUNDS, rounds); }

/* seed sample course on first run */
if(courses.length === 0){
  courses.push(makeCourse("샘플 컨트리클럽", [4,4,3,5,4,4,3,5,4, 4,4,3,5,4,4,3,5,4]));
  persistCourses();
}

function makeCourse(name, pars){
  return {
    id: uid(),
    name: name,
    createdAt: Date.now(),
    holes: pars.map((p,i)=>({ number: i+1, par: p }))
  };
}
function coursePar(course){ return course.holes.reduce((s,h)=>s+h.par,0); }

/* ---------- app state ---------- */
let state = {
  view: "home",      // home | courses | courseEdit | newRound | round | history | roundDetail
  editingCourseId: null,
  activeRoundId: null,
  viewingRoundId: null,
  modal: null        // {type:'import', data:...} etc
};

/* ---------- toast ---------- */
let toastTimer=null;
function toast(msg){
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>el.classList.remove("show"), 2200);
}

/* ---------- round scoring helpers ---------- */
// target: { mode: 'toPar' | 'total', value: number }
function targetTotalStrokes(round, player){
  const par = coursePar(round.courseSnapshot);
  if(player.targetMode === "total") return player.targetValue;
  return par + player.targetValue; // toPar
}
function playerScores(round, playerId){ return round.scores[playerId] || {}; }

function computeStats(round, player){
  const holes = round.courseSnapshot.holes;
  const scores = playerScores(round, player.id);
  let played = 0, strokeSum = 0, parSumPlayed = 0;
  holes.forEach(h=>{
    const s = scores[h.number];
    if(s != null){ played++; strokeSum += s; parSumPlayed += h.par; }
  });
  const totalPar = coursePar(round.courseSnapshot);
  const target = targetTotalStrokes(round, player);
  const remainingHoles = holes.length - played;
  const remainingBudget = target - strokeSum;
  const remainingParSum = holes.reduce((s,h)=> scores[h.number]==null ? s+h.par : s, 0);
  const remainingToParAllowed = remainingBudget - remainingParSum;
  return {
    played, strokeSum, parSumPlayed, totalPar, target,
    toParSoFar: strokeSum - parSumPlayed,
    remainingHoles, remainingBudget, remainingParSum, remainingToParAllowed,
    onPace: remainingHoles===0 ? (strokeSum<=target) : (remainingToParAllowed >= 0)
  };
}

function currentHoleGuidance(round, player){
  const stats = computeStats(round, player);
  const curHole = round.courseSnapshot.holes.find(h=>h.number===round.currentHole);
  if(!curHole) return null;
  if(stats.remainingHoles === 0){
    return { text: `18홀 완료 · 최종 ${stats.strokeSum}타 (파 대비 ${fmtPm(stats.toParSoFar)})`, warn: stats.strokeSum > stats.target };
  }
  const avgAllowed = stats.remainingBudget / stats.remainingHoles;
  const recommended = Math.max(curHole.par - 2, Math.round(curHole.par + (stats.remainingToParAllowed / stats.remainingHoles)));
  const warn = stats.remainingToParAllowed < 0;
  const text = `이번 홀(파${curHole.par}) 권장 ${recommended}타 이내 · 남은 ${stats.remainingHoles}홀 평균 ${avgAllowed.toFixed(1)}타 여유`
    + (warn ? ` · 목표(${stats.target}타) 대비 파플레이로도 ${Math.abs(stats.remainingToParAllowed)}타 초과` : ` · 목표(${stats.target}타) 대비 ${fmtPm(-stats.remainingToParAllowed)}홀 여유`);
  return { text, warn, recommended };
}

function fmtPm(n){
  n = Math.round(n*10)/10;
  if(n === 0) return "E";
  return (n>0?"+":"") + n;
}

/* ---------- GPS caddie: location consent, position, distance ---------- */
function getLocationConsent(){ return loadJSON(LS_CONSENT, null); } // null=not asked yet, true/false=decided
function setLocationConsent(v){ saveJSON(LS_CONSENT, v); }

function ensureLocationConsent(){
  return new Promise(resolve=>{
    const existing = getLocationConsent();
    if(existing === true || existing === false){ resolve(existing); return; }
    state.modal = { type:"locationConsent", resolve };
    render();
  });
}

function getPosition(){
  return new Promise((resolve, reject)=>{
    if(!navigator.geolocation){ reject(new Error("GEO_UNSUPPORTED")); return; }
    navigator.geolocation.getCurrentPosition(
      pos => resolve({ lat: pos.coords.latitude, lng: pos.coords.longitude }),
      err => reject(err),
      { enableHighAccuracy: true, timeout: 8000, maximumAge: 0 }
    );
  });
}

function haversineMeters(lat1, lng1, lat2, lng2){
  const R = 6371000, toRad = d => d * Math.PI / 180;
  const dLat = toRad(lat2 - lat1), dLng = toRad(lng2 - lng1);
  const a = Math.sin(dLat/2)**2 + Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLng/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

function findNearestCourse(pos){
  let best = null, bestDist = Infinity;
  courses.forEach(c=>{
    if(!c.location) return;
    const d = haversineMeters(pos.lat, pos.lng, c.location.lat, c.location.lng);
    if(d < bestDist){ bestDist = d; best = c; }
  });
  return best ? { course: best, dist: bestDist } : null;
}

const NEARBY_COURSE_RADIUS_M = 3000;

let lastPosition = null;
let locationWatchId = null;
let mapInstance = null;

function startLocationWatch(){
  if(!navigator.geolocation || locationWatchId != null) return;
  locationWatchId = navigator.geolocation.watchPosition(
    pos => { lastPosition = { lat: pos.coords.latitude, lng: pos.coords.longitude }; updateDistanceWidget(); },
    err => { /* keep last known position on transient GPS errors */ },
    { enableHighAccuracy: true, maximumAge: 4000, timeout: 10000 }
  );
}
function stopLocationWatch(){
  if(locationWatchId != null){ navigator.geolocation.clearWatch(locationWatchId); locationWatchId = null; }
}
function manageLocationWatch(){
  if(state.view === "round" && getLocationConsent() === true){
    startLocationWatch();
    updateDistanceWidget();
  } else {
    stopLocationWatch();
  }
}

function updateDistanceWidget(){
  const el = document.getElementById("distanceToGreen");
  if(!el) return;
  const round = rounds.find(r=>r.id===state.activeRoundId);
  if(!round) return;
  const hole = round.courseSnapshot.holes.find(h=>h.number===round.currentHole);
  if(!hole || !hole.green){ el.innerHTML = `<div class="dist-sub">이 홀 그린 위치 없음</div>`; return; }
  if(!lastPosition){ el.innerHTML = `<div class="dist-sub">위치 확인 중...</div>`; return; }
  const d = haversineMeters(lastPosition.lat, lastPosition.lng, hole.green.lat, hole.green.lng);
  el.innerHTML = `<span class="dist-num">${Math.round(d)}</span><span class="dist-unit">m · 그린까지</span>`;
}

function getPutts(round, pid, hole){
  return (round.putts && round.putts[pid] && round.putts[pid][hole] != null) ? round.putts[pid][hole] : null;
}

function computeSkins(round){
  const holes = round.courseSnapshot.holes;
  let pot = 0;
  const totals = {};
  round.players.forEach(p=> totals[p.id] = 0);
  holes.forEach(h=>{
    const entries = round.players
      .map(p=>({ id: p.id, score: playerScores(round, p.id)[h.number] }))
      .filter(e=> e.score != null);
    if(entries.length < round.players.length) return; // wait until everyone has entered this hole
    pot += 1;
    const min = Math.min(...entries.map(e=>e.score));
    const winners = entries.filter(e=>e.score === min);
    if(winners.length === 1){ totals[winners[0].id] += pot; pot = 0; }
  });
  return { totals, carryOver: pot };
}

/* ---------- share link (encode round in URL hash) ---------- */
function encodeRoundForShare(round){
  const json = JSON.stringify(round);
  return btoa(unescape(encodeURIComponent(json)));
}
function decodeRoundFromShare(b64){
  const json = decodeURIComponent(escape(atob(b64)));
  return JSON.parse(json);
}
function buildShareUrl(round){
  const base = location.href.split("#")[0];
  return base + "#r=" + encodeRoundForShare(round);
}

function checkIncomingShare(){
  const h = location.hash;
  if(h && h.startsWith("#r=")){
    try{
      const incoming = decodeRoundFromShare(h.slice(3));
      state.modal = { type:"import", round: incoming };
      history.replaceState(null, "", location.pathname); // clear hash
    }catch(e){ /* ignore malformed */ }
  }
}

           <button class="btn sm" data-act="openMap">${icon('map',15)}지도 보기</button>

    }

      <button class="btn" data-act="prevHole" ${round.currentHole<=1?'disabled':''}>← 이전 홀</button>

function renderScorecardTable(round){
  const holes = round.courseSnapshot.holes;
  const out = holes.slice(0,9), inn = holes.slice(9,18);
  const outPar = out.reduce((s,h)=>s+h.par,0), inPar = inn.reduce((s,h)=>s+h.par,0);
  let head = `<tr><th class="pname">플레이어</th>${holes.map(h=>`<th>${h.number}</th>`).join("")}<th>OUT</th><th>IN</th><th>TOT</th><th>+/-</th></tr>`;
  head += `<tr><th class="pname">PAR</th>${holes.map(h=>`<th>${h.par}</th>`).join("")}<th>${outPar}</th><th>${inPar}</th><th>${outPar+inPar}</th><th>-</th></tr>`;
  const rows = round.players.map(p=>{
    const scores = playerScores(round,p.id);
    const cells = holes.map(h=>{
      const s = scores[h.number];
      if(s==null) return `<td>-</td>`;
      const cls = s < h.par ? "score-birdie" : s > h.par ? "score-bogey" : "score-par";
      return `<td><span class="score-mark ${cls}">${s}</span></td>`;
    }).join("");
    const outSum = out.reduce((sum,h)=> scores[h.number]!=null ? sum+scores[h.number] : sum, 0);
    const inSum = inn.reduce((sum,h)=> scores[h.number]!=null ? sum+scores[h.number] : sum, 0);
    const stats = computeStats(round, p);
    return `<tr><td class="pname">${escapeHtml(p.name)}</td>${cells}<td>${outSum||"-"}</td><td>${inSum||"-"}</td><td><b>${stats.strokeSum||"-"}</b></td><td>${stats.played?fmtPm(stats.toParSoFar):"-"}</td></tr>`;
  }).join("");
  return `<table class="scorecard">${head}${rows}</table>`;
}

function renderHistory(){
  const finished = rounds.filter(r=>r.finished).sort((a,b)=>b.updatedAt-a.updatedAt);
  const leaderboard = buildLeaderboard();
  return `
  <div class="card">
    <h2>${icon('trophy',18)} 누계 리더보드</h2>
    <p class="muted">완료된 라운드를 기준으로 참가자 이름별 누계를 집계합니다.</p>
    ${leaderboard.length ? `<div class="scroll-x"><table class="leader-table">
      <tr><th>이름</th><th>라운드</th><th>평균타수</th><th>평균 파대비</th><th>평균퍼팅</th><th>베스트</th></tr>
      ${leaderboard.map(l=>`<tr><td><b>${escapeHtml(l.name)}</b></td><td>${l.rounds}</td><td>${l.avg.toFixed(1)}</td><td>${fmtPm(l.avgToPar)}</td><td>${l.avgPutts!=null?l.avgPutts.toFixed(1):"-"}</td><td>${l.best}</td></tr>`).join("")}
    </table></div>` : `<div class="empty">완료된 라운드가 없습니다.</div>`}
  </div>
  <div class="card">
    <h3>완료된 라운드</h3>
    ${finished.length ? finished.map(r=>renderRoundListItem(r)).join("") : `<div class="empty">기록이 없습니다.</div>`}
  </div>
  <div class="ad-slot">광고 영역 (준비 중)</div>`;
}

function buildLeaderboard(){
  const finished = rounds.filter(r=>r.finished);
  const map = {};
  finished.forEach(r=>{
    r.players.forEach(p=>{
      const stats = computeStats(r, p);
      if(stats.played === 0) return;
      const key = p.name.trim();
      if(!map[key]) map[key] = { name:key, rounds:0, totalStrokes:0, totalToPar:0, best:Infinity, totalPutts:0, puttsHoles:0 };
      map[key].rounds++;
      map[key].totalStrokes += stats.strokeSum;
      map[key].totalToPar += stats.toParSoFar;
      map[key].best = Math.min(map[key].best, stats.strokeSum);
      if(r.putts && r.putts[p.id]){
        Object.values(r.putts[p.id]).forEach(v=>{ map[key].totalPutts += v; map[key].puttsHoles++; });
      }
    });
  });
  return Object.values(map).map(m=>({
    name:m.name, rounds:m.rounds, avg:m.totalStrokes/m.rounds, avgToPar:m.totalToPar/m.rounds, best:m.best,
    avgPutts: m.puttsHoles>0 ? m.totalPutts/m.puttsHoles : null
  })).sort((a,b)=>a.avg-b.avg);
}

  return `
  <div class="card">
    <div class="row between">
      <h2 style="margin:0;">${escapeHtml(round.name)}</h2>
      ${!round.finished ? `<button class="btn sm" data-act="resumeRound" data-id="${round.id}">이어하기</button>` : ""}
    </div>
    <p class="muted">${escapeHtml(round.courseSnapshot.name)} · 파${coursePar(round.courseSnapshot)} · ${new Date(round.createdAt).toLocaleDateString('ko-KR')}</p>
    <div class="scroll-x">${renderScorecardTable(round)}</div>
    <div class="row" style="margin-top:10px;">
      <button class="btn secondary block" data-act="shareRoundDetail" data-id="${round.id}">${icon('link',15)}공유 링크 만들기</button>
    </div>
  </div>
  ${round.players.length >= 2 ? (()=>{
    const sk = computeSkins(round);
    return `<div class="card">
      <h3>사이드 게임 · 스킨스 결과</h3>
      ${round.players.map(p=>`<div class="list-item"><div class="name">${escapeHtml(p.name)}</div><span class="pill">${sk.totals[p.id]}점</span></div>`).join("")}
    </div>`;
  })() : ""}
  <button class="btn ghost block" data-act="nav" data-view="history">목록으로</button>
  `;
}

function renderModal(){
  const m = state.modal;
  let inner = "";
  if(m.type === "import"){
    const r = m.round;
    inner = `
      <button class="close-x" data-act="closeModal">&times;</button>
      <h3>공유받은 라운드 불러오기</h3>
      <p class="muted">${escapeHtml(r.name)} · ${escapeHtml(r.courseSnapshot.name)} · 참가자 ${r.players.map(p=>escapeHtml(p.name)).join(", ")}</p>
      <p class="muted">불러오면 내 기기에 사본으로 저장되어 이어서 기록할 수 있어요. 갱신 후에는 새 공유 링크를 다시 전달해주세요.</p>
      <div class="row" style="margin-top:14px;">
        <button class="btn block" data-act="confirmImport">불러오기</button>
        <button class="btn ghost block" data-act="closeModal">취소</button>
      </div>`;
  } else if(m.type === "share"){
    inner = `
      <button class="close-x" data-act="closeModal">&times;</button>
      <h3>공유 링크</h3>
      <p class="muted">아래 링크를 동반자에게 보내면 현재 스코어카드를 그대로 확인/이어쓰기 할 수 있어요.</p>
      <div class="share-box">
        <input type="text" readonly value="${escapeAttr(m.url)}" id="shareUrlInput">
        <button class="btn sm" data-act="copyShareUrl">복사</button>
      </div>`;
  } else if(m.type === "locationConsent"){
    inner = `
      <button class="close-x" data-act="closeModal">&times;</button>
      <h3>위치 정보 이용 동의</h3>
      <p class="muted">GPS로 현재 위치를 확인해서 방문 중인 골프장을 자동으로 찾고, 그린까지 거리를 계산하는 데 사용해요. 위치 정보는 이 기기에만 저장되고 서버로 전송되지 않아요.</p>
      <div class="row" style="margin-top:14px;">
        <button class="btn block" data-act="consentAllow">동의</button>
        <button class="btn ghost block" data-act="consentDeny">거부</button>
      </div>`;
  } else if(m.type === "map"){
    inner = `
      <button class="close-x" data-act="closeModal">&times;</button>
      <h3>코스 지도</h3>
      <div id="mapContainer"></div>
      <p class="muted" style="margin-top:8px;">공식 골프장 지도가 아니라, 사용자가 직접 기록한 위치를 보여줘요. 여러 번 방문할수록 정확도가 좋아집니다.</p>`;
  }
  const backdrop = document.createElement("div");
  backdrop.className = "modal-backdrop";
  backdrop.innerHTML = `<div class="modal">${inner}</div>`;
  backdrop.addEventListener("click", (e)=>{ if(e.target === backdrop) closeModal(); });
  app.appendChild(backdrop);
  if(m.type === "map") requestAnimationFrame(initRoundMap);
}

function closeModal(){
  if(state.modal && state.modal.type === "locationConsent" && state.modal.resolve){
    state.modal.resolve(false); // dismissed without a decision - ask again next time
  }
  if(mapInstance){ mapInstance.remove(); mapInstance = null; }
  state.modal = null;
  render();
}

function initRoundMap(){
  const round = rounds.find(r=>r.id===state.activeRoundId);
  const container = document.getElementById("mapContainer");
  if(!round || !container || typeof L === "undefined") return;
  const hole = round.courseSnapshot.holes.find(h=>h.number===round.currentHole);
  const center = (hole && hole.green) ? [hole.green.lat, hole.green.lng]
    : lastPosition ? [lastPosition.lat, lastPosition.lng]
    : (round.courseSnapshot.location ? [round.courseSnapshot.location.lat, round.courseSnapshot.location.lng] : [37.5665, 126.9780]);
  mapInstance = L.map(container).setView(center, 17);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19, attribution: '&copy; OpenStreetMap contributors'
  }).addTo(mapInstance);
  if(hole && hole.green){
    L.marker([hole.green.lat, hole.green.lng]).addTo(mapInstance).bindPopup(`${round.currentHole}번 그린`);
  }
  if(lastPosition){
    L.circleMarker([lastPosition.lat, lastPosition.lng], { radius:8, color:"#1f6f43", fillColor:"#1f6f43", fillOpacity:0.9 }).addTo(mapInstance).bindPopup("내 위치");
  }
  setTimeout(()=>{ if(mapInstance) mapInstance.invalidateSize(); }, 150);
}

/* ---------- events ---------- */
function bindEvents(){
  app.querySelectorAll("[data-act]").forEach(el=>{
    const act = el.getAttribute("data-act");
    if(el.tagName === "INPUT" && act==="setScoreManual"){
      el.addEventListener("change", onSetScoreManual);
      return;
    }
    if(el.tagName === "INPUT" && act==="setPutts"){
      el.addEventListener("change", onSetPutts);
      return;
    }
    el.addEventListener("click", onAction);
  });
  const addBtn = app.querySelector('[data-act="addPlayerRow"]');
  if(addBtn) addBtn.onclick = onAddPlayerRow;
  const holeGrid = document.getElementById("holeGrid");
  if(holeGrid) holeGrid.addEventListener("change", updateParSum);
}

function updateParSum(){
  const sum = Array.from(document.querySelectorAll("#holeGrid select")).reduce((s,sel)=>s+parseInt(sel.value,10),0);
  const el = document.getElementById("parSum");
  if(el) el.textContent = `(합계 ${sum})`;
}

function onAction(e){
  const el = e.currentTarget;
  const act = el.getAttribute("data-act");
  switch(act){
    case "nav": {
      const target = el.getAttribute("data-view");
      state.view = target;
      render();
      if(target === "newRound" && getLocationConsent() === true) onAutoDetectCourse();
      if(target === "home" && getLocationConsent() === true) detectNearbyCourseForHome();
      break;
    }
    case "gotoRound": state.view = "round"; render(); break;
    case "newCourse": state.editingCourseId = null; state.view = "courseEdit"; render(); break;
    case "editCourse": state.editingCourseId = el.getAttribute("data-id"); state.view = "courseEdit"; render(); break;
    case "deleteCourse": onDeleteCourse(el.getAttribute("data-id")); break;
    case "saveCourse": onSaveCourse(el.getAttribute("data-id")); break;
    case "saveCourseLocation": onSaveCourseLocation(el.getAttribute("data-id")); break;
    case "startRound": onStartRound(); break;
    case "startRoundHereQuick": onStartRoundHereQuick(); break;
    case "openRoundFromList": onOpenRoundFromList(el.getAttribute("data-id")); break;
    case "prevHole": onNavHole(-1); break;
    case "nextHole": onNavHole(1); break;
    case "jumpHole": onJumpHole(parseInt(el.getAttribute("data-hole"),10)); break;
    case "setScore": onSetScore(el.getAttribute("data-pid"), parseInt(el.getAttribute("data-hole"),10), parseInt(el.getAttribute("data-val"),10)); break;
    case "shareRound": onShareRound(state.activeRoundId); break;
    case "shareRoundDetail": onShareRound(el.getAttribute("data-id")); break;
    case "finishRound": onFinishRound(); break;
    case "resumeRound": onOpenRoundFromList(el.getAttribute("data-id")); break;
    case "closeModal": closeModal(); break;
    case "confirmImport": onConfirmImport(); break;
    case "copyShareUrl": onCopyShareUrl(); break;
    case "autoDetectCourse": onAutoDetectCourse(); break;
    case "enableGps": onEnableGps(); break;
    case "saveGreenLocation": onSaveGreenLocation(parseInt(el.getAttribute("data-hole"),10)); break;
    case "openMap": onOpenMap(); break;
    case "consentAllow": onConsentDecision(true); break;
    case "consentDeny": onConsentDecision(false); break;
    case "resetLocationConsent": setLocationConsent(null); toast("위치 서비스 설정이 초기화되었습니다"); render(); break;
    case "installApp": onInstallApp(); break;
    case "dismissInstallBanner": onDismissInstallBanner(); break;
    case "clearGreenLocation": onClearGreenLocation(parseInt(el.getAttribute("data-hole"),10)); break;
  }
}

function onDeleteCourse(id){
  if(!confirm("이 코스를 삭제할까요?")) return;
  courses = courses.filter(c=>c.id!==id);
  persistCourses();
  render();
}

function onSaveCourse(id){
  const name = document.getElementById("courseName").value.trim() || "이름없는 코스";
  const holes = Array.from(document.querySelectorAll("#holeGrid select")).map(sel=>({
    number: parseInt(sel.getAttribute("data-hole"),10),
    par: parseInt(sel.value,10)
  }));
  if(id){
    const c = courses.find(c=>c.id===id);
    c.name = name; c.holes = holes;
  } else {
    courses.push({ id: uid(), name, holes, createdAt: Date.now() });
  }
  persistCourses();
  toast("코스가 저장되었습니다");
  state.view = "courses";
  render();
}

function onAddPlayerRow(){
  const container = document.getElementById("playerRows");
  container.insertAdjacentHTML("beforeend", renderPlayerRow(newRoundPlayerCount));
  newRoundPlayerCount++;
}

function onStartRound(){
  const courseId = document.getElementById("courseSelect").value;
  const course = courses.find(c=>c.id===courseId);
  const roundName = document.getElementById("roundName").value.trim() || "라운드";
  const nameInputs = document.querySelectorAll("[data-pname]");
  const players = [];
  nameInputs.forEach(inp=>{
    const i = inp.getAttribute("data-pname");
    const name = inp.value.trim();
    if(!name) return;
    const tmode = document.querySelector(`[data-ptmode="${i}"]`).value;
    const tval = parseInt(document.querySelector(`[data-ptval="${i}"]`).value, 10) || 0;
    players.push({ id: uid(), name, targetMode: tmode, targetValue: tval });
  });
  if(players.length === 0){ toast("참가자를 최소 1명 입력해주세요"); return; }

  const round = {
    id: uid(),
    name: roundName,
    courseId: course.id,
    courseSnapshot: JSON.parse(JSON.stringify(course)),
    players,
    scores: {},
    putts: {},
    currentHole: 1,
    finished: false,
    createdAt: Date.now(),
    updatedAt: Date.now()
  };
  players.forEach(p=> round.scores[p.id] = {});
  rounds.push(round);
  persistRounds();
  state.activeRoundId = round.id;
  state.view = "round";
  newRoundPlayerCount = 1;
  render();
}

function onOpenRoundFromList(id){
  const r = rounds.find(r=>r.id===id);
  if(!r) return;
  if(r.finished){ state.viewingRoundId = id; state.view = "roundDetail"; }
  else { state.activeRoundId = id; state.view = "round"; }
  render();
}

function onNavHole(delta){
  const round = rounds.find(r=>r.id===state.activeRoundId);
  round.currentHole = Math.min(18, Math.max(1, round.currentHole + delta));
  render();
}
function onJumpHole(n){
  const round = rounds.find(r=>r.id===state.activeRoundId);
  round.currentHole = n;
  render();
}

function onSetScore(pid, hole, val){
  const round = rounds.find(r=>r.id===state.activeRoundId);
  round.scores[pid][hole] = val;
  round.updatedAt = Date.now();
  persistRounds();
  render();
}
function onSetScoreManual(e){
  const el = e.currentTarget;
  const pid = el.getAttribute("data-pid");
  const hole = parseInt(el.getAttribute("data-hole"),10);
  const val = parseInt(el.value,10);
  const round = rounds.find(r=>r.id===state.activeRoundId);
  if(!val || val<1){ delete round.scores[pid][hole]; }
  else { round.scores[pid][hole] = val; }
  round.updatedAt = Date.now();
  persistRounds();
  render();
}

function onSetPutts(e){
  const el = e.currentTarget;
  const pid = el.getAttribute("data-pid");
  const hole = parseInt(el.getAttribute("data-hole"),10);
  const val = parseInt(el.value,10);
  const round = rounds.find(r=>r.id===state.activeRoundId);
  if(!round.putts) round.putts = {};
  if(!round.putts[pid]) round.putts[pid] = {};
  if(isNaN(val)){ delete round.putts[pid][hole]; }
  else { round.putts[pid][hole] = val; }
  round.updatedAt = Date.now();
  persistRounds();
}

async function onConsentDecision(v){
  const resolve = state.modal && state.modal.resolve;
  setLocationConsent(v);
  state.modal = null;
  render();
  if(resolve) resolve(v);
}

async function onAutoDetectCourse(){
  const consent = await ensureLocationConsent();
  if(!consent){ toast("위치 접근이 거부되어 자동 인식을 사용할 수 없어요"); return; }
  toast("현재 위치를 확인하는 중...");
  try{
    const pos = await getPosition();
    const found = findNearestCourse(pos);
    const sel = document.getElementById("courseSelect");
    if(found && found.dist <= NEARBY_COURSE_RADIUS_M){
      if(sel) sel.value = found.course.id;
      toast(`현재 위치 기반으로 "${found.course.name}" 코스가 자동 선택되었습니다 (약 ${Math.round(found.dist)}m)`);
    } else {
      toast("현재 위치와 일치하는 저장된 코스가 없어요. 라운드 중 위치를 등록하면 다음부터 자동 인식돼요.");
    }
  }catch(e){
    toast("위치 정보를 가져오지 못했습니다");
  }
}

async function detectNearbyCourseForHome(){
  try{
    const pos = await getPosition();
    const found = findNearestCourse(pos);
    if(found && found.dist <= NEARBY_COURSE_RADIUS_M){
      homeDetectedCourse = found;
      if(state.view === "home") render();
    }
  }catch(e){ /* silent - background check */ }
}

function onStartRoundHereQuick(){
  state.view = "newRound";
  render();
  const sel = document.getElementById("courseSelect");
  if(sel && homeDetectedCourse) sel.value = homeDetectedCourse.course.id;
}

async function onSaveCourseLocation(id){
  const consent = await ensureLocationConsent();
  if(!consent){ toast("위치 접근이 거부되었습니다"); return; }
  try{
    const pos = await getPosition();
    const c = courses.find(c=>c.id===id);
    if(!c){ toast("코스를 찾을 수 없습니다"); return; }
    c.location = { lat: pos.lat, lng: pos.lng };
    persistCourses();
    toast("코스 위치가 저장되었습니다");
    render();
  }catch(e){ toast("위치 정보를 가져오지 못했습니다"); }
}

async function onEnableGps(){
  const consent = await ensureLocationConsent();
  if(consent){ render(); } else { toast("위치 접근이 거부되었습니다"); }
}

async function onSaveGreenLocation(holeNumber){
  const consent = await ensureLocationConsent();
  if(!consent){ toast("위치 접근이 거부되어 저장할 수 없어요"); return; }
  try{
    // A watchPosition is already running in the round view (see manageLocationWatch) - reuse
    // its last fix instead of firing a competing one-shot request, which can stall indefinitely
    // when a watch is already active on the same page.
    const pos = lastPosition || await getPosition();
    const round = rounds.find(r=>r.id===state.activeRoundId);
    const hole = round.courseSnapshot.holes.find(h=>h.number===holeNumber);
    hole.green = { lat: pos.lat, lng: pos.lng };
    round.updatedAt = Date.now();
    persistRounds();
    const course = courses.find(c=>c.id===round.courseId);
    if(course){
      const ch = course.holes.find(h=>h.number===holeNumber);
      if(ch) ch.green = { lat: pos.lat, lng: pos.lng };
      persistCourses();
    }
    lastPosition = { lat: pos.lat, lng: pos.lng };
    toast(`${holeNumber}번 홀 그린 위치가 저장되었습니다`);
    render();
  }catch(e){ toast("위치 정보를 가져오지 못했습니다"); }
}

function onClearGreenLocation(holeNumber){
  if(!confirm(`${holeNumber}번 홀의 저장된 그린 위치를 초기화할까요? 다음에 그린 근처에 있을 때 다시 저장할 수 있어요.`)) return;
  const round = rounds.find(r=>r.id===state.activeRoundId);
  const hole = round.courseSnapshot.holes.find(h=>h.number===holeNumber);
  delete hole.green;
  round.updatedAt = Date.now();
  persistRounds();
  const course = courses.find(c=>c.id===round.courseId);
  if(course){
    const ch = course.holes.find(h=>h.number===holeNumber);
    if(ch) delete ch.green;
    persistCourses();
  }
  toast(`${holeNumber}번 홀 그린 위치를 초기화했습니다`);
  render();
}

function onOpenMap(){
  state.modal = { type: "map" };
  render();
}

function onShareRound(roundId){
  const round = rounds.find(r=>r.id===roundId);
  const url = buildShareUrl(round);
  state.modal = { type:"share", url };
  render();
}
function onCopyShareUrl(){
  const input = document.getElementById("shareUrlInput");
  input.select();
  navigator.clipboard && navigator.clipboard.writeText(input.value).then(()=>toast("링크가 복사되었습니다")).catch(()=>{
    document.execCommand("copy"); toast("링크가 복사되었습니다");
  });
}

function onFinishRound(){
  const round = rounds.find(r=>r.id===state.activeRoundId);
  if(!confirm("라운드를 종료할까요? 종료 후에도 기록에서 확인할 수 있어요.")) return;
  round.finished = true;
  round.updatedAt = Date.now();
  persistRounds();
  state.viewingRoundId = round.id;
  state.activeRoundId = null;
  state.view = "roundDetail";
  render();
}

function courseSignature(course){
  return course.name.trim() + "|" + course.holes.map(h=>h.par).join(",");
}

function mergeCourseGeodata(existingCourse, incomingCourseSnapshot){
  let changed = false;
  if(!existingCourse.location && incomingCourseSnapshot.location){
    existingCourse.location = incomingCourseSnapshot.location;
    changed = true;
  }
  incomingCourseSnapshot.holes.forEach(ih=>{
    const eh = existingCourse.holes.find(h=>h.number===ih.number);
    if(eh && !eh.green && ih.green){ eh.green = ih.green; changed = true; }
  });
  return changed;
}

function addCourseToLibraryIfNew(courseSnapshot){
  const sig = courseSignature(courseSnapshot);
  const existing = courses.find(c=>courseSignature(c)===sig);
  if(existing){
    if(mergeCourseGeodata(existing, courseSnapshot)) persistCourses();
    return false;
  }
  courses.push({
    id: uid(),
    name: courseSnapshot.name,
    createdAt: Date.now(),
    location: courseSnapshot.location ? { ...courseSnapshot.location } : undefined,
    holes: JSON.parse(JSON.stringify(courseSnapshot.holes))
  });
  persistCourses();
  return true;
}

function onConfirmImport(){
  const incoming = state.modal.round;
  const copy = JSON.parse(JSON.stringify(incoming));
  copy.id = uid();
  copy.updatedAt = Date.now();
  rounds.push(copy);
  persistRounds();
  const addedCourse = addCourseToLibraryIfNew(copy.courseSnapshot);
  state.modal = null;
  state.activeRoundId = copy.finished ? null : copy.id;
  state.viewingRoundId = copy.finished ? copy.id : null;
  state.view = copy.finished ? "roundDetail" : "round";
  toast(addedCourse ? "라운드를 불러왔습니다 · 새 코스가 내 코스 목록에 저장되었습니다" : "라운드를 불러왔습니다");
  render();
}

    "재현 방법(문제 신고 시):\n1. \n2. \n\n" +

  return "https://github.com/kwondino123420-beep/golf-rounding-log/issues/new"
    + "?title=" + encodeURIComponent(title)
    + "&body=" + encodeURIComponent(body);
}

function escapeHtml(s){ return String(s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function escapeAttr(s){ return escapeHtml(s); }
